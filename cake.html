<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Happy Birthday</title>
	<link rel="stylesheet" href="cake.css">
</head>
<body>
	<main class="birthday-card">
		<p class="eyebrow">A little celebration for you</p>
		<h1>Happy Birthday!</h1>
		<p class="message">Wishing you a day filled with joy, laughter, and sweet surprises.</p>

		<div id="cake" aria-label="A birthday cake with a lit candle">
			<div class="plate"></div>
			<div class="cake-layer cake-bottom"></div>
			<div class="cake-layer cake-middle"></div>
			<div class="cake-layer cake-top">
				<div class="drip drip-one"></div>
				<div class="drip drip-two"></div>
				<div class="drip drip-three"></div>
			</div>
			<div class="candle">
				<div class="fire"></div>
			</div>
		</div>

		<p class="signature">Make a wish</p>
	</main>
</body>
</html>
